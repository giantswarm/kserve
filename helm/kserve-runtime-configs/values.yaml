      securityContext:
        runAsUser: 1000  # User ID is not defined in the Dockerfile, so we need to set it here to run as non-root
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    vllmserver:
      disabled: false
      image: ""
      tag: latest
      lmcacheUseExperimental: "True"
      imagePullSecrets: []
