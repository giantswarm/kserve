kserve:
  version: v0.20.0
  llmisvcConfigs:
    # -- Ship KServe's well-known `LLMInferenceServiceConfig` presets (`files/llmisvcconfigs`).
    enabled: false
    # -- Registry prefix the presets' `ghcr.io/llm-d/` images are rewritten to at render time. The default is the digest-identical mirror set giantswarm/llm-d keeps on gsoci at the same tags; set `ghcr.io/llm-d/` to render upstream's images.
    imageRegistry: gsoci.azurecr.io/giantswarm/
    # @schema additionalProperties: {type: object, additionalProperties: {type: string}}
    # -- Per-preset image overrides, applied after the registry rewrite: `<preset name>: {<container name>: <image reference>}`. `main` is the runtime container of every preset, `llm-d-routing-sidecar` the routing sidecar of the decode presets; every other preset renders unchanged. See the README for the precedence and what an override image must provide.
    images: {}
  servingruntime:
    # -- Render the classic `ClusterServingRuntime`s (`files/runtimes`). Not part of the Giant Swarm serving path, which is llm-d only: the chart ships no third-party runtime image, so a runtime renders only when its `image` is set, and the switch fails when none is.
    enabled: false
    modelNamePlaceholder: "{{.Name}}"
    tensorflow:
      disabled: false
      image: ""
      tag: 2.6.2
      imagePullSecrets: []
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1000  # User is not defined in the Dockerfile, so we need to set it here to run as non-root
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    mlserver:
      disabled: false
      image: ""
      tag: 1.5.0
      modelClassPlaceholder: "{{.Labels.modelClass}}"
      imagePullSecrets: []
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    sklearnserver:
      disabled: false
      image: ""
      tag: ""
      imagePullSecrets: []
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    xgbserver:
      disabled: false
      image: ""
      tag: ""
      imagePullSecrets: []
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    huggingfaceserver:
      disabled: false
      image: ""
      tag: ""
      imagePullSecrets: []
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      lmcacheUseExperimental: "True"
      devShm:
        enabled: false
        sizeLimit: ""
      hostIPC:
        enabled: false
    huggingfaceserver_multinode:
      disabled: false
      imagePullSecrets: []
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      shm:
        enabled: true
        sizeLimit: "3Gi"
    tritonserver:
      disabled: false
      image: ""
      tag: 23.05-py3
      imagePullSecrets: []
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1000  # https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/customization_guide/deploy.html#run-as-a-non-root-user
        allowPrivilegeEscalation: false
        privileged: false
