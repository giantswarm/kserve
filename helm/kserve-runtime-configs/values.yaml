        privileged: false
        capabilities:
          drop:
            - ALL
      devShm:
        enabled: false
        sizeLimit: ""
      hostIPC:
        enabled: false
    art:
      image: gsoci.azurecr.io/giantswarm/art-explainer
      defaultVersion: ""
      imagePullSecrets: []
  security:
    autoMountServiceAccountToken: true
  inferenceservice:
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
      requests:
        cpu: "1"
        memory: "2Gi"
  opentelemetryCollector:
    scrapeInterval: "5s"
    metricReceiverEndpoint: "keda-otel-scaler.keda.svc:4317"
    metricScalerEndpoint: "keda-otel-scaler.keda.svc:4318"
    resource:
      cpuLimit: "1"
      memoryLimit: "2Gi"
      cpuRequest: "200m"
      memoryRequest: "512Mi"
  autoscaler:
    scaleUpStabilizationWindowSeconds: "0"
    scaleDownStabilizationWindowSeconds: "300"
