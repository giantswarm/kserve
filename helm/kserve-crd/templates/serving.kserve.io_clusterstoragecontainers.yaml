{{- $existing := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "clusterstoragecontainers.serving.kserve.io" -}}
{{- $render := true -}}
{{- if $existing -}}
  {{- $owner := get (default dict $existing.metadata.annotations) "meta.helm.sh/release-name" -}}
  {{- if and $owner (ne $owner .Release.Name) -}}
    {{- $render = false -}}
  {{- end -}}
{{- end -}}
{{- if $render }}
{{- $doc := .Files.Get "files/serving.kserve.io_clusterstoragecontainers.yaml" }}
{{- if .Values.crd.keep }}
{{- /* Giant Swarm: keep the CRD on uninstall; the annotation is injected into
       the vendored document next to the controller-gen marker. */}}
{{- $doc = replace "controller-gen.kubebuilder.io/version: v0.19.0" "controller-gen.kubebuilder.io/version: v0.19.0\n    helm.sh/resource-policy: keep" $doc }}
{{- end }}
{{ $doc }}
{{- end }}
