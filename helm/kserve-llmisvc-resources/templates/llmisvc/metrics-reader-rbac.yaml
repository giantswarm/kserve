{{- $controller := .Values.kserve.llmisvc.controller }}
{{- if and $controller.serviceMonitor.enabled $controller.metricsSecure }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-isvc-resources.deploymentName" . }}-metrics-reader
  labels:
    {{- include "llm-isvc-resources.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- with $controller.serviceMonitor.metricsReaderSubjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-isvc-resources.deploymentName" $ }}-metrics-reader
  labels:
    {{- include "llm-isvc-resources.labels" $ | nindent 4 }}
    app.kubernetes.io/component: controller
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-isvc-resources.deploymentName" $ }}-metrics-reader
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
