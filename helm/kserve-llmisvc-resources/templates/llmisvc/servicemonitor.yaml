{{- $controller := .Values.kserve.llmisvc.controller }}
{{- if $controller.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "llm-isvc-resources.deploymentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-isvc-resources.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $controller.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      control-plane: {{ include "llm-isvc-resources.deploymentName" . }}
      kserve.giantswarm.io/metrics: "true"
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: https
      interval: {{ $controller.serviceMonitor.interval }}
      {{- if $controller.metricsSecure }}
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # controller-runtime serves a self-signed certificate when no cert dir is set.
        insecureSkipVerify: true
      {{- else }}
      scheme: http
      {{- end }}
{{- end }}
