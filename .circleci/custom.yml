# Repo-specific CircleCI jobs. The dynamic-config setup workflow in
# .circleci/config.yml deep-merges this file into the generated
# .circleci/workflows.yml at pipeline runtime (yq `*+`: maps merge, job lists
# append). devctl never touches this file.
#
# What this file carries beyond the golden pipeline:
#   - the five OCI-only Helm charts this repo publishes. The generator's
#     single-chart app-catalog pipeline (one chart named after the repo, pushed
#     to the app catalog with ATS tests) does not fit -- this repo ships five
#     charts with non-repo names straight to the OCI registry
#     (push_to_oci_registry, push_to_appcatalog: false) and no ATS. The `app`
#     flavour is therefore dropped in team-bumblebee.yaml so the generator
#     emits no chart jobs, and the charts live here verbatim.
#   - the second image build (Dockerfile.llmisvc -> llmisvc-controller): the
#     generated image pipeline covers exactly one root Dockerfile (the classic
#     kserve controller), so the llmisvc controller's branch/tag/china jobs are
#     mirrored here with the same shape.
#   - the retag job that also publishes both controller images under their
#     KSERVE_VERSION tag, which is what the kserve-resources and
#     kserve-llmisvc-resources charts' default values resolve to.
#   - chart-test: helm lint plus the helm-unittest suites under helm/*/tests
#     (the llmisvc preset image overrides of kserve-runtime-configs). The
#     unittest plugin is not in the architect images, so the job runs in a
#     plain container with a pinned Helm 3, the Helm the charts are built with.
#   - the check-image-registry job: every image default of every chart is a
#     gsoci.azurecr.io reference (hack/check-image-registry.py); the five chart
#     publish jobs require it.
version: 2.1

jobs:
  chart-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.17.3
    steps:
      - checkout
      - run:
          name: Install helm
          command: |
            set -euxo pipefail
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            helm version --short
      - run:
          name: Run chart tests
          command: make helm-test

  # Every image default of every chart under helm/ is a gsoci.azurecr.io reference:
  # renders each chart with its defaults (and its feature switches on) and fails
  # on any image outside the registry, in the manifests and in values.yaml. The
  # app-build-suite image ships helm and PyYAML, which the script needs.
  check-image-registry:
    docker:
      - image: gsoci.azurecr.io/giantswarm/app-build-suite:2.5.0-circleci
    resource_class: small
    shell: /bin/bash
    steps:
      - checkout
      - run:
          name: Every chart image default comes from gsoci.azurecr.io
          command: hack/check-image-registry.py

  # Retag gsoci.azurecr.io/giantswarm/<image>:<release> as :<KSERVE_VERSION> (read
  # from the image's Dockerfile). The vendored resources charts default the
  # controller tag to `kserve.version` (the upstream KServe version), so the
  # default install needs that tag present on gsoci. Re-releases at the same
  # KSERVE_VERSION overwrite the tag with a newer build of the same upstream
  # source; the repo-versioned tags stay immutable for pinning.
  retag-kserve-version:
    parameters:
      image:
        description: Image name under gsoci.azurecr.io/giantswarm/.
        type: string
      dockerfile:
        description: Dockerfile whose KSERVE_VERSION build arg names the tag.
        type: string
    docker:
      - image: gsoci.azurecr.io/giantswarm/skopeo:v1.22.3
    resource_class: small
    shell: /bin/bash
    steps:
      - checkout
      - run:
          name: Login to gsoci.azurecr.io
          command: |
            set -euo pipefail
            skopeo login \
              --username "${ACR_GSOCI_USERNAME}" \
              --password "${ACR_GSOCI_PASSWORD}" \
              gsoci.azurecr.io
      - run:
          name: Retag << parameters.image >> release as KSERVE_VERSION
          command: |
            set -euo pipefail

            KSERVE_VERSION=$(sed -n 's/^ARG KSERVE_VERSION=//p' "<< parameters.dockerfile >>" | head -n1)
            if [ -z "${KSERVE_VERSION}" ]; then
              echo "ERROR: could not read KSERVE_VERSION from << parameters.dockerfile >>"
              exit 1
            fi

            SRC="docker://gsoci.azurecr.io/giantswarm/<< parameters.image >>:${CIRCLE_TAG#v}"
            DEST="docker://gsoci.azurecr.io/giantswarm/<< parameters.image >>:${KSERVE_VERSION}"

            echo "Retagging ${SRC} -> ${DEST}"
            skopeo copy --all --preserve-digests --retry-times 5 "${SRC}" "${DEST}"

workflows:
  build:
    jobs:
    # Independent of the image and chart builds: a chart-only PR gets the
    # signal at once. Same tag filter as the build jobs.
    - chart-test:
        filters:
          tags:
            only: /^v.*/

    # Every chart image default comes from gsoci.azurecr.io; gates the chart jobs.
    - check-image-registry:
        filters:
          tags:
            only: /^v.*/

    # Chart: kserve-resources (controller + config)
    - architect/push-to-app-catalog:
        context: architect
        name: build-kserve-resources-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: kserve-resources
        push_to_appcatalog: false
        push_to_oci_registry: true
        explicit_allow_chart_name_mismatch: true
        persist_chart_archive: true
        requires:
          - check-image-registry
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
              - main

    # Chart: kserve-crd
    - architect/push-to-app-catalog:
        context: architect
        name: build-kserve-crd-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: kserve-crd
        push_to_appcatalog: false
        push_to_oci_registry: true
        explicit_allow_chart_name_mismatch: true
        persist_chart_archive: true
        requires:
          - check-image-registry
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
              - main

    # Chart: kserve-runtime-configs (ClusterServingRuntimes)
    - architect/push-to-app-catalog:
        context: architect
        name: build-kserve-runtime-configs-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: kserve-runtime-configs
        push_to_appcatalog: false
        push_to_oci_registry: true
        explicit_allow_chart_name_mismatch: true
        persist_chart_archive: true
        requires:
          - check-image-registry
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
              - main

    # Chart: kserve-llmisvc-crd (LLMInferenceService / LLMInferenceServiceConfig CRDs)
    - architect/push-to-app-catalog:
        context: architect
        name: build-kserve-llmisvc-crd-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: kserve-llmisvc-crd
        push_to_appcatalog: false
        push_to_oci_registry: true
        explicit_allow_chart_name_mismatch: true
        persist_chart_archive: true
        requires:
          - check-image-registry
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
              - main

    # Chart: kserve-llmisvc-resources (llmisvc controller + GIE CRDs)
    - architect/push-to-app-catalog:
        context: architect
        name: build-kserve-llmisvc-resources-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: kserve-llmisvc-resources
        push_to_appcatalog: false
        push_to_oci_registry: true
        explicit_allow_chart_name_mismatch: true
        persist_chart_archive: true
        requires:
          - check-image-registry
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
              - main

    # Branches: validate the llmisvc controller image build and push a dev tag
    # (same shape as the generated push-to-registries job for the root
    # Dockerfile; platforms pinned to amd64 to keep branch builds fast).
    - architect/push-to-registries:
        context: architect
        name: push-llmisvc-to-registries
        dockerfile: Dockerfile.llmisvc
        image: giantswarm/llmisvc-controller
        platforms: linux/amd64
        filters:
          branches:
            ignore:
            - main

    # Tag builds: push the multi-arch llmisvc controller image to gsoci +
    # gsociprivate. Aliyun is handled by the sync-china-registry job below.
    - architect/push-to-registries:
        context: architect
        name: push-llmisvc-to-registries-release
        dockerfile: Dockerfile.llmisvc
        image: giantswarm/llmisvc-controller
        split-china-push: true
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Mirror gsoci -> Aliyun for the llmisvc controller image.
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry-llmisvc
        image: giantswarm/llmisvc-controller
        requires:
        - push-llmisvc-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Also publish both release images under their KSERVE_VERSION tag (the
    # kserve-resources and kserve-llmisvc-resources charts' defaults).
    - retag-kserve-version:
        name: retag-kserve-controller-kserve-version
        context: architect
        image: kserve-controller
        dockerfile: Dockerfile
        requires:
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
    - retag-kserve-version:
        name: retag-llmisvc-controller-kserve-version
        context: architect
        image: llmisvc-controller
        dockerfile: Dockerfile.llmisvc
        requires:
        - push-llmisvc-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
